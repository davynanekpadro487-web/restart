<style>
/* Modale de déconnexion globale (CSS autonome pour qu'il marche partout, même sur la page Accueil) */
.modal-overlay-global {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-color: rgba(17, 24, 39, 0.5);
  backdrop-filter: blur(4px);
  opacity: 1;
  visibility: visible;
  transition: opacity 0.2s ease, visibility 0.2s ease;
}
.modal-overlay-global.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.modal-content-global {
  background: white;
  border-radius: 24px;
  padding: 32px 24px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  position: relative;
  z-index: 1000000;
  transform: scale(1);
  transition: transform 0.2s ease;
}
.modal-overlay-global.hidden .modal-content-global {
  transform: scale(0.95);
}
.modal-icon-global {
  width: 48px; height: 48px;
  border-radius: 50%;
  background-color: #FEF2F2;
  color: #EF4444;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px auto;
}
.modal-title-global {
  font-size: 1.125rem; font-weight: 700; color: #111827; text-align: center; margin-bottom: 8px; font-family: 'Poppins', sans-serif;
}
.modal-desc-global {
  font-size: 0.875rem; color: #6B7280; text-align: center; margin-bottom: 24px; font-family: 'Inter', sans-serif;
}
.modal-actions-global {
  display: flex; gap: 12px;
}
.modal-btn-cancel-global {
  flex: 1; padding: 10px 16px; background: #F3F4F6; color: #374151; font-weight: 600; font-size: 0.875rem; border-radius: 12px; border: none; cursor: pointer; text-align: center; font-family: 'Inter', sans-serif; transition: background 0.2s;
}
.modal-btn-cancel-global:hover { background: #E5E7EB; }
.modal-btn-confirm-global {
  flex: 1; padding: 10px 16px; background: #DC2626; color: white; font-weight: 600; font-size: 0.875rem; border-radius: 12px; border: none; cursor: pointer; text-align: center; font-family: 'Inter', sans-serif; transition: background 0.2s;
}
.modal-btn-confirm-global:hover { background: #B91C1C; }
</style>

<form method="post" action="{% url 'logout' %}" id="global-logout-form" style="display:none;">
        {% csrf_token %}
    </form>
    <div id="global-logout-modal" class="modal-overlay-global hidden" onclick="if(event.target === this) this.classList.add('hidden')">
        <div class="modal-content-global">
            <div class="modal-icon-global">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
            <h3 class="modal-title-global">Se déconnecter ?</h3>
            <p class="modal-desc-global">Es-tu sûre de vouloir te déconnecter de ton espace personnel ?</p>
            <div class="modal-actions-global">
                <button type="button" onclick="document.getElementById('global-logout-modal').classList.add('hidden')" class="modal-btn-cancel-global">
                    Annuler
                </button>
                <button type="button" onclick="document.getElementById('global-logout-form').submit()" class="modal-btn-confirm-global">
                    Oui, déconnexion
                </button>
            </div>
        </div>
    </div>
