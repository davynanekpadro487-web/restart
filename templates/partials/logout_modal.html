<form method="post" action="{% url 'logout' %}" id="global-logout-form" style="display:none;">
        {% csrf_token %}
    </form>
    <div id="global-logout-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity" onclick="document.getElementById('global-logout-modal').classList.add('hidden')"></div>
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl relative z-[10000] transform scale-100">
            <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center text-red-500 mb-4 mx-auto">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 text-center mb-2">Se déconnecter ?</h3>
            <p class="text-gray-500 text-sm text-center mb-6">Es-tu sûre de vouloir te déconnecter de ton espace personnel ?</p>
            <div class="flex gap-3">
                <button type="button" onclick="document.getElementById('global-logout-modal').classList.add('hidden')" class="flex-1 py-2.5 px-4 bg-gray-100 text-gray-700 font-semibold text-sm rounded-xl hover:bg-gray-200 transition-colors">
                    Annuler
                </button>
                <button type="button" onclick="document.getElementById('global-logout-form').submit()" class="flex-1 py-2.5 px-4 bg-red-600 text-white font-semibold text-sm rounded-xl hover:bg-red-700 transition-colors shadow-sm">
                    Oui, déconnexion
                </button>
            </div>
        </div>
    </div>
